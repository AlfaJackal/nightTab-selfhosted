name: docker-publish

# builds the image and pushes it to the GitHub container registry:
# "latest" from main, a version tag for every v* git tag

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # only what ends up in the image; GitHub ignores this filter for tags,
    # so a release is always built
    paths:
      - 'src/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.common.js'
      - 'webpack.prod.js'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Image name
        id: name
        # registry names have to be lower case
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # start the image that was just pushed on both architectures and use it once
  smoke-test:
    needs: build-and-push
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Start
        run: |
          docker run -d --name nighttab -p 8080:8080 "${{ needs.build-and-push.outputs.image }}"
          echo "architecture: $(docker exec nighttab uname -m)"

      - name: Page and health
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 1; done
          echo
          curl -sf http://localhost:8080/ | grep -q '<title>'

      - name: Profile survives a restart
        run: |
          curl -sf -X PUT -H 'Content-Type: application/json'             --data '{"nightTab":true,"version":"7.6.0","state":{},"bookmark":[{"name":{"text":"smoke"},"items":[]}]}'             http://localhost:8080/api/data
          docker restart nighttab
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/api/data | grep -q '"smoke"'

      - name: Log
        if: always()
        run: docker logs nighttab
